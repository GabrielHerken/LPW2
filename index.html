<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./sprites/favicon.png" type="image/x-icon">
</head>
<body>
    <canvas width="200" height="200" id="backgroundLayer"></canvas>
    <canvas width="200" height="200" id="objectsLayer"></canvas>
    <canvas width="200" height="200" id="entitiesLayer"></canvas>
    <canvas width="200" height="200" id="attacksLayer"></canvas>
    <canvas width="200" height="200" id="overlayLayer"></canvas>

    <p id="cash"><span>CASH:</span> $0</p>
    <button type="button" id="store-button">Loja</button>
    <div id="store" class="hided">
        <h1>LOJA</h1>
        <div id="atributos">
            <h2>ATRIBUTOS</h2>
            <ul>
                <li data-attribute="force" data-quantity="1"><span>Força: <span>1</span></span><div>$<span>10</span><button type="button">+</button></div></li>
                <li data-attribute="velocity" data-quantity="1"><span>Velocidade: <span>1</span></span><div>$<span>10</span><button type="button">+</button></div></li>
                <li data-attribute="defense" data-quantity="1"><span>Defesa: <span>1</span></span><div>$<span>10</span><button type="button">+</button></div></li>
                <li data-attribute="life" data-quantity="1"><span>Vida: <span>1</span></span><div>$<span>10</span><button type="button">+</button></div></li>
                <li data-attribute="regen" data-quantity="1"><span>Regeneração: <span>1</span></span><div>$<span>10</span><button type="button">+</button></div></li>
            </ul>
        </div>
    </div>
    
    <script src="./scripts/stdModule.js" type="module"></script>
    <script src="./scripts/gameController.js" type="module"></script>
    <script src="./scripts/renderController.js" type="module"></script>
    <script src="./scripts/characterController.js" type="module"></script>
    <script src="./scripts/backgroundController.js" type="module"></script>
    <script src="./scripts/attackController.js" type="module"></script>
    <script src="./scripts/enemiesController.js" type="module"></script>
    <script src="./scripts/storeManager.js" type="module"></script>
</body>
</html>
